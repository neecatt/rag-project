name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  openapi:
    name: OpenAPI validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli lint openapi.yaml

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend
        run: python -m pip install -e "backend[dev]"
      - name: Run backend tests
        run: pytest tests/backend -q

  ingestion:
    name: Data ingestion tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend
        run: python -m pip install -e "backend[dev]"
      - name: Run ingestion-focused tests
        run: pytest tests/backend/test_ingestion_service.py tests/backend/test_text_extraction.py tests/backend/test_chunking.py -q

  frontend:
    name: Frontend build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
